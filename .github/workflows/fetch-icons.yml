# Временный workflow: скачивает сгенерированный лист UI-иконок с CDN
# (из контейнера сессии прямой доступ к CDN закрыт) и коммитит его в ветку.
# Будет удалён после нарезки иконок.
name: fetch-icons
on:
  push:
    branches: ['claude/inventory-item-icons-is1k3h']
    paths: ['.github/workflows/fetch-icons.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/inventory-item-icons-is1k3h
      - name: Download icon sheet and push
        run: |
          curl -sSL --fail -o empty-sheet.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GgKXy9yBXLJ3Q3t4nvhA9UPM6C/hf_20260731_201623_70986f1d-6c3d-4563-b97c-602562d8dd43.png"
          file empty-sheet.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add empty-sheet.png
          git commit -m "temp: fetch generated empty-state sheet from CDN"
          git push
