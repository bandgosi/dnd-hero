<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сказки про Давида и Луку</title>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;700&display=swap">
<!-- Общий профиль «Детской полки»: имя ребёнка на все приложения -->
<script src="../shared/profile.js"></script>
<style>
  :root{
    --sky1:#8fd3f4; --sky2:#c9ecff;
    --grass:#7ec850; --grass-dark:#5faa3c;
    --pitch:#57b04a; --pitch-dark:#4a9e3e;
    --track:#e0955a;
    --sun:#ffd54a;
    --cat:#f2b53a; --cat-dark:#d99320;
    --text:#3a2f22; --card:#fffaf0; --accent:#ff8a50;
    --kit-white:#f5f5f2; --kit-red:#d8402f;
    --dark:#141a38; --flame:#ffb347;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,#aee3ff 0%,#dff4ff 55%,#c8ecb0 100%);
    color:var(--text);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;overflow-y:auto;
    padding:6px 0 18px;
  }
  body > *{flex-shrink:0}
  h1{
    font-family:'Comfortaa',cursive;
    font-size:clamp(16px,4.6vw,27px);
    font-weight:700;text-align:center;margin:8px 16px 0;
    color:#2d5a1e;text-shadow:0 1px 0 #fff;
  }
  .subtitle{font-size:clamp(13px,3.6vw,16px);opacity:.7;margin-top:2px;text-align:center}

  /* ===== ОГЛАВЛЕНИЕ ===== */
  #menu{width:min(94vw,560px);margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tale-card{
    background:var(--card);
    border:2px solid #f0dcae;
    border-radius:20px;
    padding:16px 12px 14px;
    text-align:center;cursor:pointer;
    box-shadow:0 5px 14px rgba(120,90,30,.14);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tale-card:active{transform:scale(.96)}
  .tale-cover{
    font-size:44px;line-height:1;
    width:76px;height:76px;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .tale-num{font-size:11.5px;font-weight:700;color:#b8946a;letter-spacing:1px}
  .tale-title{font-family:'Comfortaa',cursive;font-weight:700;font-size:clamp(13px,3.6vw,15.5px);color:#3a2f22;margin-top:3px;line-height:1.25}
  .tale-scenes{font-size:12px;opacity:.6;margin-top:5px}

  /* ===== СКАЗКА ===== */
  #reader{display:none;flex-direction:column;align-items:center;width:100%}
  .stage-wrap{width:min(94vw,560px);margin-top:8px}
  .stage{
    width:100%;aspect-ratio:10/9;
    border-radius:26px;overflow:hidden;
    background:linear-gradient(180deg,#6fc4f0 0%,#a5dcf5 45%,#d4f0ff 60%,#c8ecb0 60%);
    box-shadow:0 12px 34px rgba(60,100,40,.28), inset 0 0 0 4px rgba(255,255,255,.55);
  }
  .stage svg{width:100%;height:100%;display:block}
  .stage svg .anim, .stage svg .anim *{transform-box:fill-box}

  .story{
    margin:12px auto 8px;
    width:min(94vw,560px);
    background:var(--card);
    border:2px solid #f0dcae;
    border-radius:18px;
    padding:13px 18px;
    font-size:clamp(14.5px,4.1vw,18.5px);
    line-height:1.45;text-align:center;
    box-shadow:0 4px 14px rgba(120,90,30,.12);
    animation:fadeIn .6s ease both;
  }
  .story b{color:#d97516}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .controls{display:flex;gap:10px;margin:6px 0 12px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{
    font-family:'Comfortaa',cursive;
    font-size:clamp(15px,4vw,18px);font-weight:700;
    color:#4a2d0e;
    background:linear-gradient(180deg,#ffe9a8,var(--sun));
    border:none;border-radius:999px;padding:12px 26px;cursor:pointer;
    box-shadow:0 4px 0 #d9a83f, 0 6px 16px rgba(255,213,74,.4);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a83f}
  button.ghost{background:#fff;color:var(--text);border:2px solid #d9cba8;box-shadow:0 3px 0 #d9cba8}
  button.sound, button.home{padding:12px 16px;font-size:20px;line-height:1}
  button.sound.off{filter:grayscale(1);opacity:.6}
  .dots{display:flex;gap:8px;margin-bottom:4px}
  .dots span{width:9px;height:9px;border-radius:50%;background:rgba(90,120,60,.3);transition:all .3s}
  .dots span.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .hint{font-size:12.5px;opacity:.6;margin-top:2px;text-align:center}

  /* ====== АНИМАЦИИ ====== */
  .sway{animation:sway 3.4s ease-in-out infinite;transform-origin:center bottom}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .bob{animation:bob 3s ease-in-out infinite}
  .bob.b2{animation-delay:-1.5s}
  .bob.b3{animation-delay:-.8s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:center bottom}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.985)}}
  .run{animation:run .4s ease-in-out infinite}
  .run.r2{animation-delay:-.2s}
  @keyframes run{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
  .tail{animation:tailw 2.6s ease-in-out infinite;transform-origin:left center}
  @keyframes tailw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
  .cloud1{animation:cloudm 40s linear infinite}
  .cloud2{animation:cloudm 55s linear infinite;animation-delay:-30s}
  @keyframes cloudm{from{transform:translateX(-120px)}to{transform:translateX(620px)}}
  .sunrays{animation:spin 24s linear infinite;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinwheel{animation:spin 1.6s linear infinite;transform-origin:center}
  .spinball{animation:spin 2.4s linear infinite;transform-origin:center}
  .flapwing{animation:flap .5s ease-in-out infinite;transform-origin:right top}
  @keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
  .land{animation:land 2.8s ease-out forwards}
  @keyframes land{0%{transform:translate(60px,-230px)}70%{transform:translate(6px,-16px)}100%{transform:translate(0,0)}}
  .chase{animation:chase .45s ease-in-out infinite}
  @keyframes chase{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .retreat{animation:retreat 2.2s ease-out forwards}
  @keyframes retreat{to{transform:translateX(85px)}}
  .brave{animation:brave 1.4s ease-out forwards;transform-origin:center bottom}
  @keyframes brave{0%{transform:scale(1)}60%{transform:scale(1.12) translateY(-6px)}100%{transform:scale(1.1) translateY(-5px)}}
  .tremble{animation:tremble .3s ease-in-out infinite}
  @keyframes tremble{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
  .cheer{animation:cheer 1.2s ease-in-out infinite}
  .cheer.c2{animation-delay:-.6s}
  .cheer.c3{animation-delay:-.3s}
  @keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .heart{animation:heartp 2.4s ease-in-out infinite;transform-origin:center}
  .heart.h2{animation-delay:-1.2s}
  @keyframes heartp{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.25);opacity:1}}
  .rumble{animation:rumble 1.6s ease-in-out infinite;transform-origin:center}
  @keyframes rumble{0%,100%{transform:scale(1)}20%{transform:scale(1.06)}40%{transform:scale(.98)}60%{transform:scale(1.04)}}
  .blink{animation:blink 4s infinite;transform-origin:center}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .fly-by{animation:flyby 3s ease-in-out infinite}
  @keyframes flyby{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-10px)}}
  .pass{animation:pass 3s ease-in-out infinite}
  @keyframes pass{0%,100%{transform:translate(0,0)}25%{transform:translate(60px,-34px)}50%{transform:translate(120px,0)}75%{transform:translate(60px,-34px)}}
  .kickleg{animation:kick 1.8s ease-in-out infinite;transform-origin:center top}
  @keyframes kick{0%,55%,100%{transform:rotate(0)}70%{transform:rotate(-38deg)}82%{transform:rotate(6deg)}}
  .shoot{animation:shoot 2.6s ease-in forwards}
  @keyframes shoot{0%,30%{transform:translate(0,0)}75%{transform:translate(150px,-58px)}85%{transform:translate(158px,-48px)}100%{transform:translate(160px,-44px)}}
  .shoot2{animation:shoot2 2.6s ease-in forwards}
  @keyframes shoot2{0%,30%{transform:translate(0,0)}75%{transform:translate(-150px,-58px)}85%{transform:translate(-158px,-48px)}100%{transform:translate(-160px,-44px)}}
  .wave{animation:wavef 1s ease-in-out infinite;transform-origin:left bottom}
  @keyframes wavef{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  .droop{animation:droop 1.6s ease-out forwards;transform-origin:center bottom}
  @keyframes droop{to{transform:translateY(4px) scale(.98)}}
  .tapeL{animation:tapeL 1.8s ease-out forwards;transform-origin:left center}
  .tapeR{animation:tapeR 1.8s ease-out forwards;transform-origin:right center}
  @keyframes tapeL{to{transform:rotate(38deg)}}
  @keyframes tapeR{to{transform:rotate(-38deg)}}
  .confetti{animation:conf 3s linear infinite}
  .confetti.f2{animation-delay:-1s}
  .confetti.f3{animation-delay:-2s}
  @keyframes conf{0%{transform:translateY(-40px);opacity:0}15%{opacity:1}100%{transform:translateY(300px);opacity:0}}
  .shine{animation:shine 2s ease-in-out infinite;transform-origin:center}
  @keyframes shine{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.06);filter:drop-shadow(0 0 10px var(--sun))}}
  .pop{animation:pop 1.2s ease-out forwards;transform-origin:center}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .balloon{animation:balloonk 3.6s ease-in-out infinite;transform-origin:center bottom}
  .balloon.bl2{animation-delay:-1.2s}
  .balloon.bl3{animation-delay:-2.4s}
  @keyframes balloonk{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
  .lidoff{animation:lidoff 1.6s ease-out forwards}
  @keyframes lidoff{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(46px,-70px) rotate(28deg);opacity:.9}}
  .popup{animation:popup 1.6s ease-out forwards;transform-origin:center bottom}
  @keyframes popup{0%,35%{transform:translateY(26px) scale(.6);opacity:0}75%{transform:translateY(-6px) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
  .ride{animation:ridek .5s ease-in-out infinite}
  .ride.rd2{animation-delay:-.25s}
  @keyframes ridek{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .wheelie{animation:wheelie 2.6s ease-in-out infinite;transform-origin:16% 92%}
  @keyframes wheelie{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-16deg)}}
  /* прыжок с трамплина: разгон у подножия -> взлёт с вершины -> зависание -> приземление справа */
  .jump{animation:jump 3.2s ease-in-out infinite}
  @keyframes jump{
    0%{transform:translate(-150px,52px) rotate(0deg)}
    22%{transform:translate(-40px,6px) rotate(-20deg)}
    38%{transform:translate(10px,-30px) rotate(-14deg)}
    55%{transform:translate(60px,-58px) rotate(-4deg)}
    72%{transform:translate(110px,-24px) rotate(8deg)}
    88%,100%{transform:translate(150px,52px) rotate(0deg)}
  }
  /* трюк в полёте: как прыжок, но в высшей точке передок задран сильнее */
  .wheelie2{animation:wheelie2 3.2s ease-in-out infinite}
  @keyframes wheelie2{
    0%{transform:translate(-150px,52px) rotate(0deg)}
    22%{transform:translate(-40px,6px) rotate(-20deg)}
    38%{transform:translate(10px,-30px) rotate(-24deg)}
    55%{transform:translate(60px,-58px) rotate(-30deg)}
    72%{transform:translate(110px,-24px) rotate(-6deg)}
    88%,100%{transform:translate(150px,52px) rotate(0deg)}
  }
  /* сонные буквы z-z-z всплывают */
  .zzz text{opacity:0;animation:zzz 3.4s linear infinite}
  .zzz text:nth-child(2){animation-delay:1.7s}
  @keyframes zzz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(16px,-30px)}}
  /* плавное катание вперёд-назад по кадру */
  .roll{animation:roll 3.4s ease-in-out infinite}
  .roll.rl2{animation-delay:-1.7s}
  @keyframes roll{0%,100%{transform:translateX(-30px)}50%{transform:translateX(40px)}}
  /* сальто на скейте: разгон, взлёт с сальто 360, приземление */
  .flip{animation:flip 3.4s ease-in-out infinite}
  @keyframes flip{
    0%{transform:translate(-160px,50px) rotate(0deg)}
    25%{transform:translate(-50px,4px) rotate(0deg)}
    42%{transform:translate(0px,-64px) rotate(-140deg)}
    58%{transform:translate(50px,-64px) rotate(-320deg)}
    75%{transform:translate(110px,-6px) rotate(-360deg)}
    90%,100%{transform:translate(160px,50px) rotate(-360deg)}
  }
  /* прыжок со ступенек: катит по верху, спрыгивает вниз-вправо */
  .stairjump{animation:stairjump 3.4s ease-in-out infinite}
  @keyframes stairjump{
    0%{transform:translate(-120px,-40px)}
    30%{transform:translate(-30px,-44px)}
    46%{transform:translate(20px,-70px)}
    66%{transform:translate(70px,-10px)}
    82%,100%{transform:translate(120px,40px)}
  }
  /* сальто на роликах */
  .rollflip{animation:rollflip 3.4s ease-in-out infinite}
  @keyframes rollflip{
    0%{transform:translate(-160px,48px) rotate(0deg)}
    26%{transform:translate(-40px,4px) rotate(0deg)}
    44%{transform:translate(6px,-60px) rotate(150deg)}
    60%{transform:translate(52px,-60px) rotate(330deg)}
    76%{transform:translate(112px,-4px) rotate(360deg)}
    90%,100%{transform:translate(160px,48px) rotate(360deg)}
  }
  .flame{animation:flamek .45s ease-in-out infinite alternate;transform-origin:center bottom}
  .flame.fl2{animation-delay:-.2s}
  .flame.fl3{animation-delay:-.35s}
  @keyframes flamek{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.18) rotate(3deg)}}
  .glow{animation:glowk 2.4s ease-in-out infinite;transform-origin:center}
  @keyframes glowk{0%,100%{opacity:.5}50%{opacity:.85}}
  .darkblink{animation:blink 3.1s infinite;transform-origin:center}
  .darkblink.d2{animation-delay:-1.1s}
  .darkblink.d3{animation-delay:-2s}
  .cakein{animation:cakein 3s ease-out forwards}
  @keyframes cakein{0%{transform:translateX(-260px)}70%{transform:translateX(12px)}100%{transform:translateX(0)}}
  .blowout{animation:blowout 2.4s ease-out forwards;transform-origin:center bottom}
  @keyframes blowout{0%,55%{transform:scale(1);opacity:1}75%{transform:scale(1.4);opacity:.6}100%{transform:scale(0);opacity:0}}
  .smoke{animation:smokek 2.8s ease-out forwards;opacity:0}
  @keyframes smokek{0%,60%{opacity:0;transform:translateY(0)}75%{opacity:.7}100%{opacity:0;transform:translateY(-26px)}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>

<h1 id="pageTitle">📚 Сказки про Давида и Луку</h1>
<div class="subtitle" id="pageSub">Выбери сказку!</div>

<div id="menu"></div>

<div id="reader">
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  <div class="story" id="story"></div>
  <div class="dots" id="dots"></div>
  <div class="controls">
    <button class="home ghost" id="btnHome" title="К оглавлению">📖</button>
    <button class="ghost" id="btnBack">◀ Назад</button>
    <button id="btnNext">Дальше ▶</button>
    <button class="sound off" id="btnSound" title="Озвучка">🔇</button>
  </div>
  <div class="hint">🔊 Нажми на динамик — и сказка будет читаться вслух!</div>
</div>

<script>
// ======================================================
//                ОБЩАЯ БИБЛИОТЕКА ДЕТАЛЕЙ
// ======================================================
const sun = `
<g transform="translate(430,62)">
  <circle r="70" fill="url(#sunHalo)"/>
  <g class="anim"><g class="sunrays" stroke="#ffe27a" stroke-width="5" stroke-linecap="round" opacity=".85">
    <line x1="0" y1="-46" x2="0" y2="-34"/><line x1="0" y1="34" x2="0" y2="46"/>
    <line x1="-46" y1="0" x2="-34" y2="0"/><line x1="34" y1="0" x2="46" y2="0"/>
    <line x1="-32" y1="-32" x2="-24" y2="-24"/><line x1="24" y1="24" x2="32" y2="32"/>
    <line x1="32" y1="-32" x2="24" y2="-24"/><line x1="-24" y1="24" x2="-32" y2="32"/>
  </g></g>
  <circle r="28" fill="url(#sunG)"/>
  <circle cx="-9" cy="-9" r="9" fill="#fff6c9" opacity=".5"/>
  <circle cx="-8" cy="-2" r="3" fill="#c98a30"/><circle cx="8" cy="-2" r="3" fill="#c98a30"/>
  <path d="M-8,7 Q0,13 8,7" stroke="#c98a30" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="-13" cy="4" r="3" fill="#ff9a76" opacity=".4"/><circle cx="13" cy="4" r="3" fill="#ff9a76" opacity=".4"/>
</g>`;

const clouds = `
<g class="cloud1">
  <g fill="#ffffff" opacity=".95">
    <ellipse cx="70" cy="70" rx="40" ry="17"/><ellipse cx="98" cy="58" rx="28" ry="15"/><ellipse cx="46" cy="60" rx="24" ry="13"/>
  </g>
  <ellipse cx="70" cy="76" rx="46" ry="9" fill="#d4e6f2" opacity=".5"/>
</g>
<g class="cloud2">
  <g fill="#ffffff" opacity=".8">
    <ellipse cx="0" cy="130" rx="34" ry="13"/><ellipse cx="24" cy="120" rx="24" ry="12"/>
  </g>
</g>`;

const skyBase = sun + clouds;

const ground = `
<path d="M0,300 Q90,268 200,286 Q320,304 400,278 Q450,264 500,282 L500,320 L0,320 Z" fill="#8fce68" opacity=".55"/>
<path d="M0,312 Q120,288 260,304 Q380,318 500,296 L500,330 L0,330 Z" fill="#7bc158" opacity=".7"/>
<rect x="0" y="300" width="500" height="150" fill="url(#grassG)"/>
<path d="M0,300 Q40,292 80,300 Q120,308 160,300 Q200,292 240,300 Q280,308 320,300 Q360,292 400,300 Q440,308 500,300 L500,308 L0,308 Z" fill="#4f9e32" opacity=".45"/>
<g stroke="#4f9e32" stroke-width="2" stroke-linecap="round" opacity=".5">
  <path d="M40,318 q3,-8 6,0 M48,318 q3,-10 6,0 M120,326 q3,-8 6,0 M300,320 q3,-9 6,0 M360,330 q3,-8 6,0 M440,322 q3,-10 6,0"/>
</g>
<ellipse cx="80" cy="420" rx="60" ry="10" fill="#3f7d2c" opacity=".22"/>
<ellipse cx="400" cy="430" rx="70" ry="10" fill="#3f7d2c" opacity=".22"/>`;

const flowers = `
<g>
  <g transform="translate(60,340)"><line y2="14" stroke="#3f7d2c" stroke-width="2.5"/><circle r="5" fill="#ff8a50"/><circle r="2" fill="#ffd54a"/></g>
  <g transform="translate(455,355)"><line y2="14" stroke="#3f7d2c" stroke-width="2.5"/><circle r="5" fill="#ff6b9d"/><circle r="2" fill="#ffd54a"/></g>
  <g transform="translate(30,395)"><line y2="14" stroke="#3f7d2c" stroke-width="2.5"/><circle r="5" fill="#b48cff"/><circle r="2" fill="#ffd54a"/></g>
</g>`;

const house = (x=330,y=170,s=1) => `
<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="70" cy="152" rx="82" ry="10" fill="#3f7d2c" opacity=".2"/>
  <rect x="0" y="60" width="140" height="90" rx="6" fill="#ffe3b3" stroke="#d9a86a" stroke-width="3"/>
  <rect x="0" y="60" width="140" height="16" rx="6" fill="#fff0d0" opacity=".7"/>
  <rect x="110" y="63" width="30" height="87" fill="#e8c896" opacity=".5"/>
  <polygon points="-12,62 70,0 152,62" fill="#e05a3a" stroke="#b8432a" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="70,0 152,62 116,62" fill="#c94a34" opacity=".6"/>
  <polygon points="-12,62 70,0 74,10 -2,62" fill="#f07a5c" opacity=".5"/>
  <rect x="55" y="95" width="34" height="55" rx="4" fill="#8a5a2e"/>
  <rect x="55" y="95" width="34" height="55" rx="4" fill="#6a4420" opacity=".3"/>
  <circle cx="83" cy="124" r="3" fill="#ffd54a"/>
  <rect x="14" y="80" width="28" height="26" rx="4" fill="#bfe9ff" stroke="#8a5a2e" stroke-width="3"/>

// ======================================================
//                       ЛОГИКА КНИГИ
// ======================================================
let taleIdx = -1;      // -1 = оглавление
let sceneIdx = 0;
let soundOn = false;
const progress = TALES.map(()=>0); // запоминаем, где остановились

const menuEl = document.getElementById('menu');
const readerEl = document.getElementById('reader');
const pageTitle = document.getElementById('pageTitle');
const pageSub = document.getElementById('pageSub');
const stage = document.getElementById('stage');
const story = document.getElementById('story');
const dots  = document.getElementById('dots');
const btnNext = document.getElementById('btnNext');
const btnBack = document.getElementById('btnBack');
const btnHome = document.getElementById('btnHome');
const btnSound = document.getElementById('btnSound');

function buildMenu(){
  menuEl.innerHTML = TALES.map((t,i)=>`
    <div class="tale-card" data-i="${i}">
      <div class="tale-cover" style="background:${t.bg}">${t.emoji}</div>
      <div class="tale-num">СКАЗКА ${i+1}</div>
      <div class="tale-title">${t.title}</div>
      <div class="tale-scenes">${t.scenes.length} сцен</div>
    </div>`).join('');
  menuEl.querySelectorAll('.tale-card').forEach(card=>{
    card.addEventListener('click',()=> openTale(+card.dataset.i));
  });
}

function showMenu(){
  taleIdx = -1;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  readerEl.style.display='none';
  menuEl.style.display='grid';
  pageTitle.textContent = '📚 Сказки про Давида и Луку';
  pageSub.textContent = 'Выбери сказку!';
  pageSub.style.display='block';
}

function openTale(i){
  taleIdx = i;
  sceneIdx = progress[i] || 0;
  menuEl.style.display='none';
  readerEl.style.display='flex';
  pageTitle.textContent = TALES[i].emoji + ' ' + TALES[i].title;
  pageSub.style.display='none';
  dots.innerHTML = TALES[i].scenes.map(()=>'<span></span>').join('');
  render();
}

function plainText(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent||'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{20E3}«»]/gu,'');
}

let ruVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  ruVoice = vs.find(v=>v.lang==='ru-RU') || vs.find(v=>v.lang && v.lang.startsWith('ru')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(){
  if(!soundOn || taleIdx<0 || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plainText(TALES[taleIdx].scenes[sceneIdx].text));
  u.lang = 'ru-RU';
  if(ruVoice) u.voice = ruVoice;
  u.rate = 0.92;
  u.pitch = 1.1;
  speechSynthesis.speak(u);
}

function render(){
  const tale = TALES[taleIdx];
  const scene = tale.scenes[sceneIdx];
  progress[taleIdx] = sceneIdx;
  // внедряем общие градиенты сразу после открывающего <svg ...>
  const svgWithDefs = scene.svg.replace(/(<svg[^>]*>)/, '$1' + DEFS);
  stage.innerHTML = svgWithDefs;
  story.innerHTML = scene.text;
  story.style.animation='none'; story.offsetHeight; story.style.animation='';
  [...dots.children].forEach((d,i)=>d.classList.toggle('on', i===sceneIdx));
  btnBack.style.visibility = sceneIdx===0 ? 'hidden' : 'visible';
  const last = sceneIdx===tale.scenes.length-1;
  btnNext.textContent = last
    ? (taleIdx < TALES.length-1 ? 'Следующая сказка ▶' : '📖 К оглавлению')
    : 'Дальше ▶';
  speak();
}

btnNext.addEventListener('click',()=>{
  const tale = TALES[taleIdx];
  if(sceneIdx < tale.scenes.length-1){
    sceneIdx++; render();
  } else {
    progress[taleIdx] = 0;
    if(taleIdx < TALES.length-1) openTale(taleIdx+1);
    else showMenu();
  }
});
btnBack.addEventListener('click',()=>{ if(sceneIdx>0){ sceneIdx--; render(); } });
btnHome.addEventListener('click', showMenu);
btnSound.addEventListener('click',()=>{
  soundOn = !soundOn;
  btnSound.textContent = soundOn ? '🔊' : '🔇';
  btnSound.classList.toggle('off', !soundOn);
  if(soundOn) speak(); else if('speechSynthesis' in window) speechSynthesis.cancel();
});

buildMenu();
showMenu();

/* ---------------------------------------------------------
   Связь с общим оглавлением «Детская полка».
   Необязательна: если сказки открыли отдельным файлом,
   ничего из этого не выполнится и книга работает как раньше.
   --------------------------------------------------------- */
(function () {
  if (!window.KidHub) return;

  // Кнопка «ко всем играм»: ребёнок всегда может выйти
  KidHub.addHomeButton('../index.html');

  // Здороваемся по имени, как остальные приложения
  var kid = KidHub.name();
  if (kid) {
    var sub = document.getElementById('pageSub');
    if (sub) sub.textContent = kid + ', выбери сказку!';
  }

  // Своя кнопка ведёт к списку сказок, плавающая 🏠 — ко всем играм.
  // Разводим их, чтобы ребёнок не путал.
  var own = document.getElementById('btnHome');
  if (own) { own.textContent = '📚'; own.title = 'К списку сказок'; own.setAttribute('aria-label', 'К списку сказок'); }

  // Сколько сказок начато — показывается на карточке в оглавлении
  var READ_KEY = 'skazki.read.v1';
  var read = {};
  try { read = JSON.parse(localStorage.getItem(READ_KEY) || '{}') || {}; } catch (e) { read = {}; }

  function pushSummary() {
    var n = Object.keys(read).length;
    KidHub.setSummary('skazki', {
      percent: Math.round(n / TALES.length * 100),
      stars: 0,
      label: n ? ('прочитано ' + n + ' из ' + TALES.length) : (TALES.length + ' историй')
    });
  }

  var openOriginal = openTale;
  openTale = function (i) {
    openOriginal(i);
    if (!read[i]) {
      read[i] = 1;
      try { localStorage.setItem(READ_KEY, JSON.stringify(read)); } catch (e) {}
      pushSummary();
    }
  };
  pushSummary();
})();
</script>
