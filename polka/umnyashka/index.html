<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Умняшка — обучающая игра для детей 6–7 лет: чтение, письмо и математика">
<title>Умняшка — учимся читать и считать</title>

<!-- Шрифт подгружается НЕблокирующе: без интернета приложение рисуется сразу
     системным округлым шрифтом и не ждёт таймаута сети -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/screens.css">
<link rel="stylesheet" href="styles/tasks-reading.css">
<link rel="stylesheet" href="styles/tasks-math.css">
<link rel="stylesheet" href="styles/games-literacy.css">
<link rel="stylesheet" href="styles/games-numbers.css">
<link rel="stylesheet" href="styles/worlds.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237C5CE0'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>А</text></svg>">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>
</div>

<div id="app" class="app"></div>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root" class="modal-root"></div>

<!-- Общий профиль «Детской полки»: имя и персонаж на все приложения.
     Файла может не быть, если папку открыли отдельно — тогда приложение
     просто работает само по себе. -->
<script src="../shared/profile.js"></script>

<!-- ===== Порядок загрузки важен: data → core → tasks → games → screens → app ===== -->

<!-- Данные (без DOM и без состояния) -->
<script src="data/alphabet.js"></script>
<script src="data/words.js"></script>
<script src="data/sentences.js"></script>
<script src="data/numbers.js"></script>
<script src="data/mathgen.js"></script>
<script src="data/characters.js"></script>
<script src="data/space.js"></script>
<script src="data/school.js"></script>
<script src="data/world.js"></script>

<!-- Ядро -->
<script src="core/storage.js"></script>
<script src="core/store.js"></script>
<script src="core/skills.js"></script>
<script src="core/srs.js"></script>
<script src="core/speech.js"></script>
<script src="core/sfx.js"></script>
<script src="core/fx.js"></script>
<script src="core/ui.js"></script>
<script src="core/router.js"></script>
<script src="core/mascot.js"></script>

<!-- Записанная озвучка (нейроголос, офлайн): буквы, звуки, числа,
     слова словаря и похвала. Остальное договаривает синтезатор. -->
<script src="audio/clips.js"></script>

<!-- Данные, зависящие от ядра -->
<script src="data/achievements.js"></script>
<script src="data/curriculum.js"></script>

<!-- Движок заданий и типы заданий -->
<script src="tasks/engine.js"></script>
<script src="tasks/tracing.js"></script>
<script src="tasks/reading.js"></script>
<script src="tasks/math.js"></script>
<script src="tasks/common.js"></script>
<script src="tasks/space.js"></script>
<script src="tasks/school.js"></script>
<script src="tasks/world.js"></script>

<!-- Мини-игры -->
<script src="games/shell.js"></script>
<script src="games/literacy.js"></script>
<script src="games/numbers.js"></script>
<script src="games/memory.js"></script>

<!-- Экраны и запуск -->
<script src="screens/main.js"></script>
<script src="screens/meta.js"></script>
<script src="screens/worlds.js"></script>
<script src="app.js"></script>
</body>
</html>
